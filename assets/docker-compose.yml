name: reclaim-backend

services:
  db:
    image: mysql:8.0
    container_name: reclaim-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: toor
    ports:
      - '3306:3306'
    volumes:
      - ./database:/dumps:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-ptoor']
      interval: 5s
      timeout: 5s
      retries: 20

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: reclaim-pma
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: toor
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/skillsit-hu/s17-wscnt2026-module-a-solution
    container_name: reclaim-api
    restart: unless-stopped
    ports:
      - '5000:80'
    environment:
      APP_NAME: ReClaim
      APP_ENV: production
      APP_KEY: base64:35cfQv8wG4x4h4xuyc32DlbV6DIEhioGqK9XbW62RQQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost:5000
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: reclaim_api
      DB_USERNAME: root
      DB_PASSWORD: toor
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
